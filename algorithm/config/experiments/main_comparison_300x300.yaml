experiment: pilot_main_comparison_300

binary: build/ugv_coordination
vehicle_config: config/vehicle_config.yaml

instances:
  # 10 agents
  - dir: benchmark/map300by300/agents10/empty
  - dir: benchmark/map300by300/agents10/obstacle

  # 20 agents
  - dir: benchmark/map300by300/agents20/empty
  - dir: benchmark/map300by300/agents20/obstacle

  # 30 agents
  - dir: benchmark/map300by300/agents30/empty
  - dir: benchmark/map300by300/agents30/obstacle

pattern: "*.yaml"

# Pilot sample for the largest map size. Increase only after measuring
# runtime and common-success rates on these configurations.
max_instances_per_dir: 20

methods: [clcbs, lcbr]

delta_w: [10]

timeout: 600
max_low_level_expansions: 150000
