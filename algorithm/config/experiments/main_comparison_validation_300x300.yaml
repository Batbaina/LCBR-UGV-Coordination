# ============================================================
# LCBR vs CL-CBS - Validation Pilot - 300x300
# ============================================================

experiment: main_comparison_validation_300x300

binary: build/ugv_coordination
vehicle_config: config/vehicle_config.yaml

instances:
  - dir: benchmark/map300by300/agents10/obstacle
  - dir: benchmark/map300by300/agents20/obstacle
  - dir: benchmark/map300by300/agents30/obstacle

pattern: "*.yaml"

# PILOT ONLY
max_instances_per_dir: 1

methods:
  - clcbs
  - lcbr

# Fixed window
delta_w:
  - 10

# Same-conflict Local vs Full experiment
paired_probe: true

timeout: 180
max_low_level_expansions: 150000