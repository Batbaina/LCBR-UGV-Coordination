experiment: delta_w_ablation

binary: build/ugv_coordination
vehicle_config: config/vehicle_config.yaml

instances:
# 10 agents
  - dir: benchmark/map300by300/agents10/empty
  - dir: benchmark/map300by300/agents10/obstacle
# 20 agents
  - dir: benchmark/map300by300/agents20/empty
  - dir: benchmark/map300by300/agents20/obstacle
# 30 agents
  - dir: benchmark/map300by300/agents30/empty
  - dir: benchmark/map300by300/agents30/obstacle

pattern: "*.yaml"

# Kept small on purpose: 300x300 instances are by far the slowest, and
# this ablation only needs to show the r_w/E_tot trend clearly, not
# match the main comparison's statistical power. 3/cell x 6 dirs x 5
# delta_w = 90 runs total (vs 400 for the 50x50 ablation).
max_instances_per_dir: 3

methods: [lcbr]

# r_w median was already 0.408 at delta_w=10 here (your best case) --
# this sweep checks whether it degrades toward 1 as delta_w grows, and
# how much further it can drop as delta_w shrinks.
delta_w: [3, 5, 7, 12, 22]

# Reduced from the main comparison's 600s: the ablation only needs the
# r_w/E_tot trend, not every single instance pushed to its absolute
# limit. Worst case (every run times out): 90 runs x 300s = 7.5h
# sequential -- see --parallel below to cut this further.
timeout: 300
max_low_level_expansions: 150000
