experiment: delta_w_ablation

binary: build/ugv_coordination
vehicle_config: config/vehicle_config.yaml

instances:
# 5 agents
  - dir: benchmark/map50by50/agents5/empty
  - dir: benchmark/map50by50/agents5/obstacle
# 10 agents
  - dir: benchmark/map50by50/agents10/empty
  - dir: benchmark/map50by50/agents10/obstacle
# 15 agents
  - dir: benchmark/map50by50/agents15/empty
  - dir: benchmark/map50by50/agents15/obstacle
# 20 agents
  - dir: benchmark/map50by50/agents20/empty
  - dir: benchmark/map50by50/agents20/obstacle

pattern: "*.yaml"

# Smaller than the main pilot (30/cell): each instance is now solved once
# PER delta_w value below, so total runs = instances x len(delta_w) --
# keep this modest or the batch multiplies out of hand.
max_instances_per_dir: 10

# LCBR only -- CL-CBS's own baseline doesn't depend on delta_w and is
# already covered by runs/main_comparison/ (see run_ablation.py's
# docstring); no need to re-run it here.
methods: [lcbr]

# delta_w = delta_T + k*T_s, delta_T=2, T_s=1 -> delta_w in {3,5,7,12,22}
# for k in {1,3,5,10,20}, matching the original theoretical grid (paper
# Sec. 5.4/9b). 10 is your current default (r_w=1.000 median at this map
# size -- see docs/REPRODUCIBILITY.md); the smaller values below are
# specifically to check whether r_w drops below 1 with a tighter window.
delta_w: [3, 5, 7, 12, 22]

timeout: 180
max_low_level_expansions: 150000
